# E3 veto-quality protocol, stage 1 (type: veto_eval): collect claim-conditioned
# evidence records on the test split (held-out evaluation pool). Same server
# setup as e3_collect_val_s42 (d1_bce_nomp_s42 adapter + detection services);
# evaluated in stage 3 after fit freezes tau.
exp_id: e3_collect_test_s42
type: veto_eval
seed: 42
est_hours: 0.5
notes: "E3: evidence collection, test split (held-out veto evaluation pool)"

eval:
  # VLM server spawned by the runner from this adapter (same
  # pixel-cap/adapter propagation as the d1/e2 evals — no manual server)
  lora_from_experiment: d1_bce_nomp_s42
  args:
    stage: collect
    split: test
    mode: no_reason
    threshold: 0.5
    workers: 4
    out: results/veto_eval/test.jsonl
