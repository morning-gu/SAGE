# Grid experiment (type: yolo_bce) — see _defaults.yaml for merged defaults.
exp_id: yolobce_grid_lr1e-4_e25_i224
type: yolo_bce
seed: 42
notes: "YOLO-cls with BCE (multi-label) head grid: lr=1e-4, epochs=25, imgsz=224"

train:
  output_dir: checkpoints/experiments/yolobce_grid_lr1e-4_e25_i224/train
  args:
    epochs: 25
    lr: 0.0001
    imgsz: 224
    seed: 42

eval:
  args:
    threshold: 0.5
    imgsz: 224   # must match the training grid imgsz
