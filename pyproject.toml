[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage"
version = "0.1.0"
description = "SAGE student behavior VLM training/inference (ms-swift + YuFeng-XGuard style)"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24,<2.0",
    "pillow>=10.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openai",
    "matplotlib>=3.10.9",
    "insightface>=1.0.1",
    "onnxruntime>=1.24.3",
]

[project.optional-dependencies]
infer = [
    "torch>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
    "modelscope>=1.10",
    "huggingface_hub>=0.20",
]
eval = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.11",
]

# Small model re-check servers (human detection, pose, depth, face landmarks)
servers = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "ultralytics>=8.1",
    "transformers>=4.40",
    "torch>=2.1",
    "peft>=0.10",
    "huggingface_hub>=0.20",
    "modelscope>=1.10",
    "mediapipe>=0.10",
    "truststore>=0.10",
]

# Training is handled by ms-swift in a separate 3.10+ environment:
#   pip install 'ms-swift[llm]'
# This repo ships data-conversion + inference + evaluation scripts
# + small model re-check layer (sage_recheck/) + servers/.

[tool.setuptools.packages.find]
include = ["sage", "sage_check*", "sage_recheck*", "servers*"]
